model:
  name: "microsoft/TRELLIS-image-large"
  vae_ckpt: "microsoft/TRELLIS-image-large/ckpts/ss_enc_conv3d_16l8_fp16"
  dinov2_model: "dinov2_vitl14_reg"
  encoder:
    type: "topology"
    num_layers: 2
    nhead: 8
    max_path_len: 5
    dropout: 0.1
    use_value_emb: true
  layer_range: null

dataset:
  type: "tms_image"
  data_dir: "/path/to/TMS_data/processed"
  image_dir: "/path/to/TMS_data_image"
  train_split: "configs/splits/train_all.json"
  val_split: "configs/splits/val_50.json"
  max_joints: 96
  num_workers: 4
  image_size: 518

training:
  batch_size: 2
  grad_accu: 8
  epochs: 200
  lr: 2.0e-5
  seed: 2026
  warmup_steps: 500
  fp16_mode: "amp"
  log_every_step: 10
  sample_every_step: 250
  save_every_step: 2500
  val_every_n_epochs: 20
  ema_beta: 0.999
  sample_vae: true
  use_tensorboard: true
  use_wandb: false
  num_samples: 4
  output_dir: "./outputs/sk_adapter_image"

wandb:
  project: "sk-adapter-image"
  key: ""
